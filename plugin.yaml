manifest_version: 1
name: chathub-connector
version: 0.2.0
description: >-
  ChatHub connector-platform bridge — two static meta-tools
  (list_chathub_tools / exec_chathub_tools) that proxy tool discovery and
  invocation to the ChatHub gateway over HTTP, authenticating every call with
  the per-turn CHATHUB_TURN_SECRET read via get_secret(). The device never
  holds user OAuth tokens; it only sees the current turn's short-lived secret.
author: ChatHub Platform
kind: standalone
provides_tools:
  - list_chathub_tools
  - exec_chathub_tools
